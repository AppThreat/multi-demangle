[package]
name = "multi-demangle"
version = "1.2.0"
license = "MIT"
authors = [
    "Team AppThreat <cloud@appthreat.com>"
]
documentation = ""
homepage = "https://github.com/AppThreat/multi-demangle"
repository = "https://github.com/AppThreat/multi-demangle"
readme = "README.md"
description = """
A library to demangle symbols from various languages and compilers. Fork of symbolic-demangle.
"""
build = "build.rs"
edition = "2021"
rust-version = "1.91"

exclude = ["tests/**/*"]

[package.metadata.docs.rs]
all-features = true

[lib]
name = "multi_demangle"
crate-type = ["cdylib", "rlib"]

# The `multi-demangle` CLI binary. Gated behind the `cli` feature so builds
# that only want the library or the Python extension module never compile it;
# the feature is on by default so `cargo install multi-demangle` produces the
# binary.
[[bin]]
name = "multi-demangle"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "test_cli"
required-features = ["cli"]

[features]
extension-module = ["pyo3/extension-module"]
cli = ["dep:clap"]
default = ["cli", "codewarrior", "cpp", "gnuv2", "msvc", "rust", "scala-native", "swift"]
codewarrior = ["cwdemangle"]
cpp = ["cpp_demangle"]
gnuv2 = ["gnuv2_demangle"]
msvc = ["msvc-demangler"]
rust = ["rustc-demangle"]
scala-native = ["scala_native_demangle"]
swift = ["cc"]
# Rayon-based parallel demangling of batch inputs (`demangle_iter`, Python
# `demangle_symbols`). Off by default to keep the build lean.
parallel = ["dep:rayon"]

[dependencies]
pyo3 = { version = "0.29.2" }
clap = { version = "4.5", optional = true, default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
    "suggestions",
] }
cwdemangle = { version = "1.0.0", optional = true }
cpp_demangle = { version = "0.5.1", optional = true }
gnuv2_demangle = { version = "0.4.0", optional = true }
msvc-demangler = { version = "0.11.0", optional = true }
rustc-demangle = { version = "0.1.28", optional = true }
scala_native_demangle = { package = "scala-native-demangle", version = "0.0.6", optional = true }
symbolic-common = "13.9.0"
rayon = { version = "1.10", optional = true }

[build-dependencies]
cc = { version = "1.4.4", optional = true }

[dev-dependencies]
similar-asserts = { version = "2.0.0" }
criterion = "0.7"

[[bench]]
name = "batch"
harness = false
