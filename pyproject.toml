[build-system]
requires = ["maturin>=1.10,<2.0"]
build-backend = "maturin"

[project]
name = "multi-demangle"
version = "2.1.1"
description = "A library to demangle symbols from various languages and compilers."
readme = "README.md"
license = "MIT"
homepage = "https://github.com/AppThreat/multi-demangle"
repository = "https://github.com/AppThreat/multi-demangle"
keywords = ["demangler", "binary"]

[tool.maturin]
python-source = "python"
include = [{ path = "vendor/**/*", format = "sdist" }]
# The `#[pymodule]` block is gated on this crate feature. Release CI builds
# wheels with `--all-features`, but a `pip install` of the sdist invokes the
# PEP 517 backend without any feature flags, which compiles the module block
# out and ships a wheel with no `PyInit_multi_demangle`. Declaring the feature
# here fixes every maturin-driven build, sdist ones included.
features = ["extension-module"]

authors = [
    { name = "Team AppThreat", email = "cloud@appthreat.com" }
]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]