name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    name: Rust Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check formatting
        run: cargo fmt --check
        shell: bash
      # MSVC cannot compile the vendored Swift demangler headers (`llvm` is
      # ambiguous with the vendored `__swift::__runtime::llvm`), so every
      # step that may rebuild the C++ shim needs clang. `$GITHUB_ENV`
      # persists it across steps — a plain `export` would not.
      - name: Use clang for the vendored Swift demangler (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
        shell: bash
      - name: Run cargo test
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            export RUSTFLAGS="-C link-arg=-undefined -C link-arg=dynamic_lookup"
          fi
          # `--all-features` implies `extension-module`, which only links with
          # the dynamic-lookup RUSTFLAGS above; `parallel` is the other real
          # consumer configuration (batch demangling on the rayon pool).
          cargo test --features parallel
          cargo test --all-features
        shell: bash
      - name: CLI filter smoke test
        run: |
          cargo build --bin multi-demangle
          BIN=./target/debug/multi-demangle
          if [ -x "$BIN.exe" ]; then BIN="$BIN.exe"; fi
          "$BIN" --version
          "$BIN" _ZN3foo3barEv
          "$BIN" < tests/fixtures/nm_dump.txt > "$RUNNER_TEMP/nm_actual.txt"
          diff -u tests/fixtures/nm_demangled.txt "$RUNNER_TEMP/nm_actual.txt"
          "$BIN" --normalize < tests/fixtures/nm_hygiene_dump.txt > "$RUNNER_TEMP/nm_hygiene_actual.txt"
          diff -u tests/fixtures/nm_hygiene_demangled.txt "$RUNNER_TEMP/nm_hygiene_actual.txt"
        shell: bash

  new-language-differential:
    # Plan 08: differential ratchet for the hand-written D and Ada backends.
    # Builds the apt-only GNU toolchains image (layer-cached by input hash,
    # ~2 min cold) and diffs this crate against GNU c++filt — libiberty's
    # independent D/GNAT demanglers — over the committed fixture corpora.
    # The job fails when the functional-gap count rises above the recorded
    # baseline: a gap means we now reject a symbol the reference demangler
    # accepts. Rendering differences are informative only and never fail the
    # job. Kotlin/Native and Fortran have no oracle; they are covered by the
    # corpus snapshot tests instead.
    name: New-language differential
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build the GNU toolchains image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: contrib
          file: contrib/docker/gnu-toolchains.Dockerfile
          push: false
          load: true
          tags: multi-demangle/gnu-toolchains:latest
          cache-from: type=gha
          cache-to: type=gha,mode=min
      - name: Build the CLI
        run: cargo build --bin multi-demangle
      - name: Diff the corpora against c++filt
        run: |
          contrib/collect-corpus.sh diff dlang | tee "$RUNNER_TEMP/dlang_diff.txt"
          contrib/collect-corpus.sh diff ada | tee "$RUNNER_TEMP/ada_diff.txt"
      - name: Ratchet on the functional-gap baseline
        run: |
          check() {
            local file="$1" lang="$2" baseline="$3" gaps
            gaps=$(awk '/we reject, c\+\+filt demangles/ {for (i = 1; i <= NF; i++) if ($i ~ /^[0-9]+$/) print $i}' "$file")
            echo "$lang: $gaps functional gaps (baseline $baseline)"
            if [ "$gaps" -gt "$baseline" ]; then
              echo "::error::$lang: $gaps functional gaps exceed the committed baseline of $baseline. A fixture symbol the reference demangler accepts is now rejected — fix the backend, or bump the baseline here if the gap is deliberate."
              exit 1
            fi
          }
          check "$RUNNER_TEMP/dlang_diff.txt" dlang 0
          check "$RUNNER_TEMP/ada_diff.txt" ada 1

  python-tests:
      name: Python Tests
      runs-on: ${{ matrix.os }}
      strategy:
        fail-fast: false
        matrix:
          os: [ubuntu-latest, macos-latest, windows-latest]
          python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
          with:
            persist-credentials: false
        - name: Set up Python ${{ matrix.python-version }}
          uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
          with:
            python-version: ${{ matrix.python-version }}
        - name: Build and pytest (Linux / macOS)
          if: runner.os != 'Windows'
          run: |
            python3 -m venv .venv
            source .venv/bin/activate
            pip install maturin pytest
            maturin develop --all-features
            pytest python/tests
        - name: Build and pytest (Windows)
          if: runner.os == 'Windows'
          run: |
            python -m venv .venv
            .venv\Scripts\activate
            pip install maturin pytest
            maturin develop --all-features
            pytest python/tests
          env:
            CC: clang
            CXX: clang++
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-24.04
            target: x86_64
          - runner: ubuntu-24.04
            target: x86
          - runner: ubuntu-24.04-arm
            target: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.10'
      - name: Install modern C++ cross-compiler for ARM
        if: contains(matrix.platform.target, 'arm') || contains(matrix.platform.target, 'aarch64')
        run: |
          sudo apt-get update -y
          sudo apt-get install -y g++-arm-linux-gnueabihf g++-aarch64-linux-gnu
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --all-features --release --out dist --find-interpreter
          sccache: false
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  musllinux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-24.04
            target: x86_64
          - runner: ubuntu-24.04
            target: x86
          - runner: ubuntu-24.04-arm
            target: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.10'
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --all-features --release --out dist --find-interpreter
          sccache: false
          manylinux: musllinux_1_2
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
          - runner: windows-latest
            target: x86
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.10'
          architecture: ${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          CC: clang
          CXX: clang++
        with:
          target: ${{ matrix.platform.target }}
          args: --all-features --release --out dist --find-interpreter
          sccache: false
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.10'
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --all-features --release --out dist --find-interpreter
          sccache: false
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wheels-sdist
          path: dist

  publish:
    name: Publish
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [test, python-tests, linux, musllinux, windows, macos, sdist]
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          skip-existing: true
